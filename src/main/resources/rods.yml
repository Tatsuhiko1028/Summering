# =========================================================
#  釣竿の定義（rods.yml）
#  ★ 新しい竿を足すときは、ここに1ブロック追加して /mushitori reload するだけです。
#    キー（my_rod の部分）が内部IDです。あとから変更しないでください
#    （変更すると、/mushitori give rod <ID> で指定するIDが変わります）。
#
#  ステータス（escape-modifier / size-bonus 等）がアイテムに焼き付けられる仕組み、
#  tagsの考え方は、虫取り網（nets.yml）とまったく同じです。詳しい説明はnets.ymlの
#  コメントを参照してください。
#
#  durability: 耐久値。通常釣り（バニラのアタリ）・寄ってくる釣り、どちらで使っても、
#              実際に釣れたときに減ります。寄ってくる釣りは、確率判定で失敗して
#              逃げられたときも減ります（通常釣りは、アタリが来て「逃げられた」場合も
#              同様に減ります）。0 以下にすると壊れません。
# =========================================================

# 釣竿（ステータスがアイテムに焼き付けられる点は、虫取り網と同じです。上記参照）
# escape-modifier: 逃げやすさへの補正。虫取り網と同じ考え方です（符号付き、0〜1にクランプ）。
#                  正確に釣れているように見えても、これで最終的に逃げられることがあります。
# size-bonus: 大物ボーナス。符号付き。「(size-max - size-min) × size-bonus ÷ 2」を
#             実測cmに加算します（掛け算ではありません）。例えば size-min=6.5,
#             size-max=12.0 の生物に size-bonus: 1.0 を設定すると、常に
#             (12.0-6.5)×1.0÷2 ＝ +2.75cm。生物ごとの幅に比例して動くため、
#             蝶のように幅が狭い生物でも、魚のように幅が広い生物でも、同じ
#             size-bonus値なら「同じ割合」だけ大きく／小さくなります（掛け算方式だと、
#             幅が狭い生物ほどサイズ段階が一気に何段も飛んでしまう問題がありました）。
#             負の値なら縮める方向に働きます。0 なら無効（いつもの網はこれでOK）。
#             ベースの個体がどの段階（ちいさい側／おおきい側）であっても、常に
#             ボーナスの方向へ加算されます（「ふつう」より小さい個体に大物ボーナスを
#             かけて、結果的にレア度が下がることもあり得ます）。ただし、素の時点で
#             既に最高レア度（でんせつサイズ）だった個体には効果がありません。
#             加算した結果がsize-maxを超える（またはsize-minを下回る）場合は、
#             size-max×1.0〜1.05倍（size-minなら×0.95〜1.0倍）のランダムな値に
#             丸めます。「最もおおきい」（素の抽選だけで届いた、でんせつ級のもの）は
#             size-max×1.05〜1.2倍になるため、道具の力だけではその範囲に並ばないよう、
#             あえて控えめな範囲にしています。
rods:
  my_rod:
    name: "いつもの釣竿"
    description:
      - "どこにでもある、ふつうの釣竿。"
    material: FISHING_ROD
    custom-model-data: 20011
    escape-modifier: 0.0
    size-bonus: 0.0
    price: 0
    durability: 40
  new_rod:
    name: "ふつうの釣竿"
    description:
      - "少し性能の良い、ふつうの釣竿。"
    material: FISHING_ROD
    custom-model-data: 20012
    escape-modifier: -0.1
    size-bonus: 0.05
    price: 5000
    durability: 90
  master_rod:
    name: "名人の釣竿"
    description:
      - "釣りの名人が使う、特別な釣竿。"
    material: FISHING_ROD
    custom-model-data: 20013
    escape-modifier: -0.25
    size-bonus: 0.12
    price: 20000
    durability: 0
