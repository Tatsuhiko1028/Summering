# =========================================================
#  虫取り網の定義（nets.yml）
#  ★ 新しい網を足すときは、ここに1ブロック追加して /mushitori reload するだけです。
#    キー（my_net の部分）が内部IDです。あとから変更しないでください
#    （変更すると、/mushitori give net <ID> で指定するIDが変わります）。
#
#  tags: （任意）この道具が持つタグの一覧。creatures.yml の各生物に
#        required-tags を指定すると、その生物は「タグをすべて持つ道具」でしか
#        捕まえられなくなります（省略・空なら誰でも捕まえられます）。
#        例えば、特別なイベント用の網にだけ tags: ["event"] を付け、
#        イベント限定の虫に required-tags: ["event"] を付ける、といった使い方です。
#
#  durability: 耐久値。虫を「捕まえた（＋逃げられた）」回数ぶん減ります
#              （振った回数ではありません。何もいない場所へ振っても減りません）。
#              0 以下にすると壊れません。
# =========================================================

# 虫取り網。IDは自由に増やしてOK（下記の重要事項も参照）
#
# 【重要】ステータスはアイテムに焼き付けられます：
#   ここでの escape-modifier / size-bonus / range の値は、/mushitori give でそのIDの
#   網を実際に渡した「瞬間」に、その値がアイテム自身に焼き付けられます。以降、その
#   アイテムを使うときの効果は、config.ymlの現在値ではなく、アイテムに焼き付けられた
#   値をそのまま使います。そのため、あとからここの数値を変えても、既に配布済みの
#   アイテムの効果は変わりません（次に /mushitori give したものから、新しい数値が
#   適用されます）。耐久値も、バニラの仕組み上もともとアイテムに焼き付く値なので、
#   同じ考え方です。IDを増やして新しい網を追加するのも自由です。
#
# description: アイテムの説明文（複数行可）。アイテムのIDや耐久値は自動では表示しません。
# durability: 耐久値。0 以下にすると壊れない（無限耐久）。説明文には書きませんが、
#             バニラの耐久値バー自体はアイテムに表示されます。
# escape-modifier: 逃げやすさへの補正。符号付き。生物ごとの escape-chance（creatures.yml）に
#                  この値が加算され、最終的な逃走確率になります（0〜1にクランプ）。
#                  マイナスにすると「逃しにくい網」、プラスにすると「逃しやすい網」になります
#                  （特殊アイテム用）。いつもの網は 0 のままでOKです。
#                  ※ アイテムの説明文には、符号を反転させた「捕まえやすさ」として表示されます
#                  （例: escape-modifier: -0.3 → 「捕まえやすさ +30%」）。
# size-bonus: 大物ボーナス。符号付き。「(size-max - size-min) × size-bonus ÷ 2」を
#             実測cmに加算します（掛け算ではありません）。例えば size-min=6.5,
#             size-max=12.0 の生物に size-bonus: 1.0 を設定すると、常に
#             (12.0-6.5)×1.0÷2 ＝ +2.75cm。生物ごとの幅に比例して動くため、
#             蝶のように幅が狭い生物でも、魚のように幅が広い生物でも、同じ
#             size-bonus値なら「同じ割合」だけ大きく／小さくなります（掛け算方式だと、
#             幅が狭い生物ほどサイズ段階が一気に何段も飛んでしまう問題がありました）。
#             負の値なら縮める方向に働きます。0 なら無効（いつもの網はこれでOK）。
#             ベースの個体がどの段階（ちいさい側／おおきい側）であっても、常に
#             ボーナスの方向へ加算されます（「ふつう」より小さい個体に大物ボーナスを
#             かけて、結果的にレア度が下がることもあり得ます）。ただし、素の時点で
#             既に最高レア度（でんせつサイズ）だった個体には効果がありません。
#             加算した結果がsize-maxを超える（またはsize-minを下回る）場合は、
#             size-max×1.0〜1.05倍（size-minなら×0.95〜1.0倍）のランダムな値に
#             丸めます。「最もおおきい」（素の抽選だけで届いた、でんせつ級のもの）は
#             size-max×1.05〜1.2倍になるため、道具の力だけではその範囲に並ばないよう、
#             あえて控えめな範囲にしています。
# range: （任意）この網だけの射程（ブロック）。省略すると net-catching.range の
#        全体既定値を使います。網ごとに射程を変えたい場合にどうぞ。
# material: 見た目は custom-model-data（リソースパック側の、そのmaterialの基本モデルに
#           定義した overrides で切り替える方式）で決まるため、materialの種類自体は
#           何でも構いません。ただし耐久値（durability）を正しく機能させるため、バニラで
#           元々耐久値を持つ素材（WOODEN_SWORD 等の道具系）を推奨します（STICK 等、耐久値を
#           持たない素材だと、環境によっては耐久値の設定自体が反映されないことがあります）。
#           剣・道具系の素材を使った場合に表示されてしまう攻撃力・攻撃速度等は、
#           自動的に非表示にしています。
# custom-model-data: リソースパックの overrides 側の custom_model_data と一致させる数値。
#                     省略した場合は material そのままの見た目になります。
nets:
  my_net:
    name: "いつものの虫とり網"
    description:
      - "どこにでもある、ふつうの虫とり網。"
    material: WOODEN_SWORD
    custom-model-data: 20001
    escape-modifier: 0.0
    size-bonus: 0.0
    price: 0
    durability: 40
  new_net:
    name: "あたらしい虫とり網"
    description:
      - "少し丈夫になった、あたらしい虫とり網。"
      - "いつものものより、捕まえやすい。"
    material: WOODEN_SWORD
    custom-model-data: 20002
    escape-modifier: -0.15
    size-bonus: 0.05
    price: 3000
    durability: 90
  master_net:
    name: "めいじんの虫とり網"
    description:
      - "熟練の虫とり名人が愛用する、特別な網。"
      - "壊れることなく使い続けられる。"
    material: WOODEN_SWORD
    custom-model-data: 20003
    escape-modifier: -0.3
    size-bonus: 0.12
    # この網だけ、少し射程を伸ばす例（省略すると net-catching.range の全体既定値を使う）
    range: 4.0
    price: 15000
    durability: 0
